<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo Locale</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .meteo-carte {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px 30px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: #333;
        }

        h1 { margin: 0; font-size: 28px; color: #2c3e50; }
        .temp { font-size: 64px; font-weight: bold; color: #fff; margin: 5px 0 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        
        /* Style pour le ressenti et les rafales */
        .ressenti { font-size: 16px; color: #2c3e50; font-weight: 600; margin-bottom: 10px; opacity: 0.8; }
        .rafales { font-size: 13px; color: #c0392b; font-weight: bold; margin-top: 4px; }
        
        .desc { font-size: 20px; text-transform: capitalize; color: #2c3e50; font-weight: 500; margin-bottom: 20px; }
        
        .vent-box {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 12px;
            display: none;
            justify-content: space-around;
            align-items: center;
            font-size: 16px;
            color: #2c3e50;
            font-weight: 600;
        }

        .fleche-vent {
            display: inline-block;
            font-size: 22px;
            transition: transform 0.5s ease;
        }

        .erreur { color: #d32f2f; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="meteo-carte">
        <h1 id="ville">Recherche GPS...</h1>
        <img id="icone" src="" alt="" style="display:none; margin: 10px auto; width: 100px;">
        <div class="temp"><span id="temperature">--</span>°</div>
        
        <!-- NOUVEAU : Affichage de la température ressentie -->
        <div class="ressenti">Ressenti : <span id="temp-ressentie">--</span>°</div>
        
        <div class="desc" id="description">Autorisez la localisation</div>
        
        <div class="vent-box" id="bloc-vent">
            <div style="text-align: left;">
                <div>💨 <span id="vitesse-vent">--</span> km/h</div>
                <!-- NOUVEAU : Bloc caché par défaut pour les rafales -->
                <div id="bloc-rafales" class="rafales" style="display:none;">⚠️ Rafales : <span id="rafales-vent">--</span> km/h</div>
            </div>
            <div><span class="fleche-vent" id="fleche">⬇</span> <span id="direction-vent">--</span></div>
        </div>

        <div id="message-erreur" class="erreur"></div>
    </div>

    <script>
        // ⚠️ REMETTEZ VOTRE CLÉ API ICI
        const cleAPI = 'd987d1ede347de41baa4bbd51ac41450'; 

        function obtenirDirectionVent(degres) {
            const directions = ['Nord', 'Nord-Est', 'Est', 'Sud-Est', 'Sud', 'Sud-Ouest', 'Ouest', 'Nord-Ouest'];
            return directions[Math.round(degres / 45) % 8];
        }

        function recupererMeteo(lat, lon) {
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${cleAPI}&units=metric&lang=fr`;

            fetch(url)
                .then(reponse => reponse.json())
                .then(data => {
                    document.getElementById('ville').innerText = data.name;
                    document.getElementById('temperature').innerText = Math.round(data.main.temp);
                    
                    // NOUVEAU : Récupération du ressenti
                    document.getElementById('temp-ressentie').innerText = Math.round(data.main.feels_like);
                    
                    document.getElementById('description').innerText = data.weather[0].description;
                    
                    const iconCode = data.weather[0].icon;
                    const imgIcone = document.getElementById('icone');
                    imgIcone.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
                    imgIcone.style.display = 'block';

                    const vitesseKmh = Math.round(data.wind.speed * 3.6);
                    const degres = data.wind.deg;

                    document.getElementById('vitesse-vent').innerText = vitesseKmh;
                    document.getElementById('direction-vent').innerText = obtenirDirectionVent(degres);
                    document.getElementById('fleche').style.transform = `rotate(${degres}deg)`;
                    
                    // NOUVEAU : Gestion conditionnelle des rafales
                    if (data.wind.gust) {
                        const rafalesKmh = Math.round(data.wind.gust * 3.6);
                        document.getElementById('rafales-vent').innerText = rafalesKmh;
                        document.getElementById('bloc-rafales').style.display = 'block'; // On affiche l'alerte
                    } else {
                        document.getElementById('bloc-rafales').style.display
