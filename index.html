<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo Vélo en Live</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .meteo-carte {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px 30px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: #333;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 600;
            color: #2c3e50;
        }

        .temp {
            font-size: 64px;
            font-weight: bold;
            color: #fff;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .desc {
            font-size: 20px;
            text-transform: capitalize;
            color: #2c3e50;
            font-weight: 500;
        }

        .erreur {
            color: #d32f2f;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="meteo-carte">
        <h1 id="ville">Recherche GPS...</h1>
        <img id="icone" src="" alt="" style="display:none; margin: 10px auto; width: 100px;">
        <div class="temp"><span id="temperature">--</span>°</div>
        <div class="desc" id="description">Autorisez la localisation</div>
        <div id="message-erreur" class="erreur"></div>
    </div>

    <script>
        // ⚠️ REMPLACEZ CETTE LIGNE PAR VOTRE VRAIE CLÉ API OPENWEATHERMAP
        const cleAPI = 'd987d1ede347de41baa4bbd51ac41450'; 

        function recupererMeteo(lat, lon) {
            // URL de l'API avec la position GPS, l'unité en Celsius (metric) et la langue française
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${cleAPI}&units=metric&lang=fr`;

            fetch(url)
                .then(reponse => reponse.json())
                .then(data => {
                    // Mettre à jour le HTML avec les données reçues
                    document.getElementById('ville').innerText = data.name;
                    document.getElementById('temperature').innerText = Math.round(data.main.temp);
                    document.getElementById('description').innerText = data.weather[0].description;
                    
                    // Affichage de l'icône météo officielle
                    const iconCode = data.weather[0].icon;
                    const imgIcone = document.getElementById('icone');
                    imgIcone.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
                    imgIcone.style.display = 'block';
                })
                .catch(erreur => {
                    document.getElementById('message-erreur').innerText = "Erreur de connexion à l'API.";
                });
        }

        // 1. Demander la position GPS au chargement de la page
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    // Si accepté, on lance la recherche météo avec les coordonnées
                    recupererMeteo(position.coords.latitude, position.coords.longitude);
                },
                (erreur) => {
                    // Si refusé ou introuvable
                    document.getElementById('ville').innerText = "Position introuvable";
                    document.getElementById('message-erreur').innerText = "Vous devez autoriser le GPS pour voir la météo locale.";
                }
            );
        } else {
            document.getElementById('message-erreur').innerText = "Le GPS n'est pas supporté par votre navigateur.";
        }
    </script>

</body>
</html>
