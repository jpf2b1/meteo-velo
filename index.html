<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Météo Locale</title>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .meteo-carte {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 40px 30px;
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            color: #333;
        }

        h1 { margin: 0; font-size: 28px; color: #2c3e50; }
        .temp { font-size: 64px; font-weight: bold; color: #fff; margin: 5px 0 0 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        
        .ressenti { font-size: 16px; color: #2c3e50; font-weight: 600; margin-bottom: 10px; opacity: 0.8; }
        .rafales { font-size: 13px; color: #c0392b; font-weight: bold; margin-top: 4px; }
        .desc { font-size: 20px; text-transform: capitalize; color: #2c3e50; font-weight: 500; margin-bottom: 20px; }
        
        .vent-box {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            padding: 12px;
            display: none;
            justify-content: space-around;
            align-items: center;
            font-size: 16px;
            color: #2c3e50;
            font-weight: 600;
        }

        .fleche-vent { display: inline-block; font-size: 22px; transition: transform 0.5s ease; }
        .erreur { color: #d32f2f; font-weight: bold; margin-top: 15px; font-size: 14px;}

        /* NOUVEAU : Style du bouton d'action */
        .btn-action {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-action:active { background-color: #2471a3; transform: translateY(2px); }
    </style>
</head>
<body>

    <div class="meteo-carte">
        <h1 id="ville">Météo Vélo</h1>
        <img id="icone" src="" alt="" style="display:none; margin: 10px auto; width: 100px;">
        
        <!-- NOUVEAU : Le bouton pour déclencher le GPS manuellement -->
        <button id="btn-gps" class="btn-action">📍 Obtenir ma météo</button>

        <div id="bloc-infos" style="display: none;">
            <div class="temp"><span id="temperature">--</span>°</div>
            <div class="ressenti">Ressenti : <span id="temp-ressentie">--</span>°</div>
            <div class="desc" id="description">--</div>
            
            <div class="vent-box" id="bloc-vent">
                <div style="text-align: left;">
                    <div>💨 <span id="vitesse-vent">--</span> km/h</div>
                    <div id="bloc-rafales" class="rafales" style="display:none;">⚠️ Rafales : <span id="rafales-vent">--</span> km/h</div>
                </div>
                <div><span class="fleche-vent" id="fleche">⬇</span> <span id="direction-vent">--</span></div>
            </div>
        </div>

        <div id="message-erreur" class="erreur"></div>
    </div>

    <script>
        // ⚠️ REMETTEZ VOTRE CLÉ API ICI
        const cleAPI = 'd987d1ede347de41baa4bbd51ac41450'; 

        function obtenirDirectionVent(degres) {
            const directions = ['Nord', 'Nord-Est', 'Est', 'Sud-Est', 'Sud', 'Sud-Ouest', 'Ouest', 'Nord-Ouest'];
            return directions[Math.round(degres / 45) % 8];
        }

        function recupererMeteo(lat, lon) {
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${cleAPI}&units=metric&lang=fr`;

            fetch(url)
                .then(reponse => reponse.json())
                .then(data => {
                    document.getElementById('ville').innerText = data.name;
                    document.getElementById('temperature').innerText = Math.round(data.main.temp);
                    document.getElementById('temp-ressentie').innerText = Math.round(data.main.feels_like);
                    document.getElementById('description').innerText = data.weather[0].description;
                    
                    const iconCode = data.weather[0].icon;
                    const imgIcone = document.getElementById('icone');
                    imgIcone.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
                    imgIcone.style.display = 'block';

                    const vitesseKmh = Math.round(data.wind.speed * 3.6);
                    const degres = data.wind.deg;

                    document.getElementById('vitesse-vent').innerText = vitesseKmh;
                    document.getElementById('direction-vent').innerText = obtenirDirectionVent(degres);
                    document.getElementById('fleche').style.transform = `rotate(${degres}deg)`;
                    
                    if (data.wind.gust) {
                        document.getElementById('rafales-vent').innerText = Math.round(data.wind.gust * 3.6);
                        document.getElementById('bloc-rafales').style.display = 'block';
                    } else {
                        document.getElementById('bloc-rafales').style.display = 'none';
                    }
                    
                    // On affiche les infos et on cache le bouton
                    document.getElementById('bloc-infos').style.display = 'block';
                    document.getElementById('bloc-vent').style.display = 'flex';
                    document.getElementById('btn-gps').style.display = 'none';
                })
                .catch(erreur => {
                    document.getElementById('message-erreur').innerText = "Erreur de connexion à l'API.";
                    document.getElementById('btn-gps').innerText = "📍 Réessayer";
                });
        }

        // NOUVEAU : Le GPS ne se lance QUE lorsqu'on clique sur le bouton
        document.getElementById('btn-gps').addEventListener('click', function() {
            this.innerText = "⏳ Recherche GPS...";
            document.getElementById('message-erreur').innerText = ""; // Efface les erreurs précédentes

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        recupererMeteo(position.coords.latitude, position.coords.longitude);
                    },
                    (erreur) => {
                        this.innerText = "📍 Obtenir ma météo";
                        document.getElementById('message-erreur').innerText = "GPS refusé. Modifiez les réglages de votre navigateur.";
                    }
                );
            } else {
                document.getElementById('message-erreur').innerText = "GPS non supporté.";
            }
        });
    </script>

</body>
</html>
