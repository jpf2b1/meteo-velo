<html lang="fr">
<head>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" id="meta-theme-color" content="#2980b9">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" href="data:,">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>

    <style>
        :root {
            --bg-body: #ffffff;
            --bg-panel: #ffffff;
            --bg-header: #f1f2f6;
            --border-panel: #2980b9;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --btn-bg: rgba(41, 128, 185, 0.9);
            --btn-text: #ffffff;
            --btn-active: #2471a3;
            --shadow: rgba(0, 0, 0, 0.2);
            --widget-bg: rgba(255, 255, 255, 0.85);
            --widget-border: rgba(255, 255, 255, 0.5);
            --box-vent: rgba(255, 255, 255, 0.6);
            --map-filter: none;
            --text-pente-legende: #7f8c8d;
            --card-bg: #f8f9fa;
        }

        [data-theme="dark"] {
            --bg-body: #121212;
            --bg-panel: #1e1e1e;
            --bg-header: #2d2d2d;
            --border-panel: #10ac84; 
            --text-primary: #f5f6fa;
            --text-secondary: #a4b0be;
            --btn-bg: rgba(30, 30, 30, 0.9);
            --btn-text: #10ac84; 
            --btn-active: #0e8f6e;
            --shadow: rgba(0, 0, 0, 0.5);
            --widget-bg: rgba(30, 30, 30, 0.9);
            --widget-border: rgba(255, 255, 255, 0.1);
            --box-vent: rgba(20, 20, 20, 0.6);
            --map-filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(90%);
            --text-pente-legende: #a4b0be;
            --card-bg: #2d2d2d;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; flex-direction: column; overflow: hidden; 
            background-color: var(--bg-body);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }
        
        #map { flex: 1; width: 100%; z-index: 1; }
        .leaflet-container { filter: var(--map-filter); transition: filter 0.3s ease; }
        
        #gpx-panel { 
            display: none; background: var(--bg-panel); border-top: 2px solid var(--border-panel); 
            box-shadow: 0 -4px 10px var(--shadow); padding: 10px; z-index: 1000; 
            transition: background-color 0.3s, border-color 0.3s;
        }

        #panel-header {
            text-align: center; font-size: 14px; font-weight: bold; color: var(--text-primary);
            padding: 7px 0; margin: -10px -10px 8px -10px; background: var(--bg-header);
            cursor: pointer; border-bottom: 1px solid var(--shadow); 
            display: flex; justify-content: center; align-items: center; gap: 8px;
            transition: background-color 0.3s, color 0.3s;
        }
        #panel-header:active { background: var(--shadow); }
        
        .top-controls { 
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); 
            z-index: 1000; display: flex; gap: 8px; width: 96%; max-width: 450px; 
        }
        .btn-action { 
            flex: 1; background-color: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--border-panel); padding: 12px 2px; 
            border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 12px var(--shadow); text-align: center; white-space: nowrap;
            display: flex; justify-content: center; align-items: center; gap: 4px;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, transform 0.1s;
            backdrop-filter: blur(8px);
        }
        .btn-action:active { background-color: var(--btn-active); transform: translateY(2px); }
        
        .btn-theme-toggle {
            position: absolute; top: 75px; right: 15px; z-index: 1000;
            width: 40px; height: 40px; border-radius: 50%;
            background-color: var(--btn-bg); color: var(--btn-text);
            border: 1px solid var(--border-panel); display: flex;
            justify-content: center; align-items: center; cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow); font-size: 18px;
            backdrop-filter: blur(8px); transition: all 0.3s ease;
        }
        .btn-theme-toggle:active { transform: scale(0.9); }

        .stats-gpx { 
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; 
            font-weight: bold; color: var(--text-primary); margin-bottom: 6px; font-size: 12px; gap: 6px; 
        }
        .stat-chip {
            display: inline-flex; align-items: center; gap: 4px;
            background: var(--card-bg); border: 1px solid var(--widget-border);
            padding: 3px 7px; border-radius: 6px;
        }
        .input-vitesse, .input-date { 
            text-align: center; border: 1px solid var(--text-secondary); border-radius: 5px; padding: 3px 4px; 
            font-weight: bold; color: var(--border-panel); font-family: inherit; background-color: var(--bg-panel);
            transition: color 0.3s, background-color 0.3s;
        }
        .input-vitesse { width: 42px; font-size: 12px; }
        .input-date { font-size: 12px; max-width: 148px; }
        
        .chart-container { position: relative; height: 165px; width: 100%; margin-top: 4px; cursor: crosshair; }
        .legende-pente { text-align: center; font-size: 11px; margin-top: 6px; font-weight: bold; color: var(--text-pente-legende); }
        
        .btn-reset, .btn-toggle { 
            padding: 4px 8px; font-size: 12px; border-radius: 6px; background: var(--bg-panel); 
            cursor: pointer; font-weight: bold; border: 1px solid var(--border-panel); color: var(--border-panel);
            transition: all 0.3s;
        }
        .btn-reset { display: none; }
        .btn-toggle { border-color: #27ae60; color: #27ae60; }
        [data-theme="dark"] .btn-toggle { border-color: #10ac84; color: #10ac84; }
        
        #liste-montees {
            display: none; max-height: 160px; overflow-y: auto; 
            margin-top: 12px; padding-right: 5px; scrollbar-width: thin;
        }
        .montee-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); border: 1px solid var(--widget-border);
            border-left: 6px solid var(--border-panel); margin-bottom: 8px;
            padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
            box-shadow: 0 2px 5px var(--shadow); color: var(--text-primary);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        .montee-item:hover { background: var(--bg-header); }
        .montee-item:active { transform: scale(0.98); box-shadow: 0 1px 2px var(--shadow); }
        .montee-data { font-weight: bold; color: var(--text-primary); font-size: 14px; }
        .montee-pente { 
            background: #e74c3c; color: white; padding: 4px 8px; 
            border-radius: 12px; font-weight: bold; font-size: 13px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.3); display: inline-block;
            min-width: 45px; text-align: center;
        } 
        .pente-moyenne { background: #f39c12; } 
        .pente-douce { background: #27ae60; }   

        .meteo-carte { 
            position: absolute; top: 125px; left: 50%; transform: translateX(-50%); z-index: 1000; 
            background: var(--widget-bg); backdrop-filter: blur(10px); 
            border-radius: 15px; border: 1px solid var(--widget-border); 
            padding: 15px; text-align: center; width: 85%; max-width: 320px; 
            box-shadow: 0 8px 32px 0 var(--shadow); color: var(--text-primary); 
            transition: all 0.3s;
        }
        .btn-fermer-meteo { position: absolute; top: 8px; right: 10px; font-size: 14px; cursor: pointer; color: var(--text-secondary); background: none; border: none; padding: 5px; }
        .temp { font-size: 42px; font-weight: bold; color: var(--border-panel); margin: 0; }
        [data-theme="dark"] .temp { color: #ffffff; }
        .ressenti { font-size: 14px; color: var(--text-primary); font-weight: 600; margin-bottom: 5px; opacity: 0.8; }
        .rafales { font-size: 13px; color: #c0392b; font-weight: bold; margin-top: 4px; }
        .desc { font-size: 16px; text-transform: capitalize; color: var(--text-primary); font-weight: 500; margin-bottom: 10px; }
        .vent-box { background: var(--box-vent); border-radius: 12px; padding: 10px; display: flex; justify-content: space-around; align-items: center; font-size: 14px; color: var(--text-primary); font-weight: 600; }
        .fleche-vent { display: inline-block; font-size: 20px; transition: transform 0.5s ease; }
        .erreur { color: #d32f2f; font-weight: bold; margin-top: 5px; font-size: 13px;}
        
        .leaflet-div-icon { background: transparent; border: none; }
        .leaflet-popup-content { margin: 10px !important; }
        [data-theme="dark"] .leaflet-popup-content-wrapper,
        [data-theme="dark"] .leaflet-popup-tip {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #10ac84;
        }
        [data-theme="dark"] .leaflet-popup-content .temp-popup {
            color: #ffffff !important;
        }

        .km-marker {
            background-color: var(--bg-panel); border: 2px solid #e74c3c; border-radius: 50%;
            color: var(--text-primary); font-size: 9px; font-weight: bold; display: flex;
            justify-content: center; align-items: center; width: 22px; height: 22px;
            box-shadow: 0 2px 4px var(--shadow); pointer-events: none; 
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const urlRelaisMeteo = 'https://meteo-velo-relais.jpf2b1.workers.dev';
        const map = L.map('map', {zoomControl: false}).setView([46.603354, 1.888334], 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        let traceGPXLayer = null, graphiqueAltitude = null;
        let traceMonteeActive = null, marqueurSommetActif = null;
        let marqueursVentParcours = [], donneesGPX = [], pointsMeteoParcours = [], latlngsGlobaux = [];
        let marqueursDistance = []; 
        let indexPositionCycliste = null;
        let distanceCyclisteActuelle = 0; 
        let marqueurPositionPointer = null;
        let sessionChargementId = 0;

        // ------------- GESTION DE LA BASE DE DONNÉES LOCALE (IndexedDB) -------------
        const dbPromise = new Promise((resolve, reject) => {
            const request = indexedDB.open('MeteoVeloDB', 1);
            request.onupgradeneeded = (e) => { e.target.result.createObjectStore('gpxStore'); };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });

        async function sauvegarderGPXLocal(xmlString) {
            try {
                const db = await dbPromise;
                const tx = db.transaction('gpxStore', 'readwrite');
                tx.objectStore('gpxStore').put(xmlString, 'last_gpx');
            } catch (e) { console.error("Erreur de sauvegarde locale", e); }
        }

        async function chargerDernierGPX() {
            try {
                const db = await dbPromise;
                return new Promise((resolve) => {
                    const tx = db.transaction('gpxStore', 'readonly');
                    const req = tx.objectStore('gpxStore').get('last_gpx');
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch (e) { return null; }
        }

        window.addEventListener('load', async () => {
            if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
            
            const gpxHistorique = await chargerDernierGPX();
            if (gpxHistorique) {
                document.getElementById('btn-reload').style.display = 'flex';
                
                if (window.location.search.includes('shared=true')) {
                    window.history.replaceState({}, document.title, "./"); 
                    traiterGPX(gpxHistorique); 
                }
            }
        });

        document.getElementById('btn-reload').addEventListener('click', async function() {
            this.innerText = "⏳...";
            const gpxHistorique = await chargerDernierGPX();
            if (gpxHistorique) traiterGPX(gpxHistorique);
            this.innerHTML = "🔄 Historique";
        });

        document.getElementById('gpx-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(evt) {
                const xmlString = evt.target.result;
                await sauvegarderGPXLocal(xmlString); 
                document.getElementById('btn-reload').style.display = 'flex';
                traiterGPX(xmlString); 
            };
            reader.readAsText(file);
        });
        // -----------------------------------------------------------------------------

        function initDateDepart() {
            const dateInput = document.getElementById('date-depart');
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            dateInput.value = now.toISOString().slice(0,16);
        }
        initDateDepart();

        const toggleButton = document.getElementById('theme-toggle');
        toggleButton.addEventListener('click', function() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            
            if (currentTheme === 'dark') {
                body.setAttribute('data-theme', 'light');
                this.innerHTML = '🌙';
                document.getElementById('meta-theme-color').setAttribute('content', '#2980b9');
                if (traceMonteeActive) traceMonteeActive.setStyle({ color: '#3498db' });
            } else {
                body.setAttribute('data-theme', 'dark');
                this.innerHTML = '☀️';
                document.getElementById('meta-theme-color').setAttribute('content', '#10ac84');
                if (traceMonteeActive) traceMonteeActive.setStyle({ color: '#00d2d3' });
            }
            
            if (donneesGPX.length > 0 && graphiqueAltitude) {
                const labelsDistance = donneesGPX.map(p => p.distance.toFixed(1));
                const altTemp = graphiqueAltitude.data.datasets[0].data;
                const rawDistances = donneesGPX.map(p => p.distance);
                genererGraphique(labelsDistance, altTemp, rawDistances);
            }
        });

        function calculerDistance(lat1, lon1, lat2, lon2) {
            const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        const attendre = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        map.on('click', function(e) {
            if (donneesGPX.length === 0) return; 
            let indexPlusProche = 0;
            let distMin = Infinity;
            
            for (let i = 0; i < donneesGPX.length; i++) {
                let d = calculerDistance(e.latlng.lat, e.latlng.lng, donneesGPX[i].lat, donneesGPX[i].lon);
                if (d < distMin) { distMin = d; indexPlusProche = i; }
            }
            if (distMin > 2) return;
            
            mettreAJourPointeur(indexPlusProche, false);
            
            const content = document.getElementById('panel-content');
            if (content.style.display === 'none') {
                content.style.display = 'block';
                document.getElementById('panel-header').innerHTML = '🔽 Masquer le profil';
                setTimeout(() => { if(map) map.invalidateSize(); }, 100);
            }
        });

        function mettreAJourPointeur(index, recentrerCarte = true) {
            indexPositionCycliste = index;
            if (graphiqueAltitude) graphiqueAltitude.update();
            if (marqueurPositionPointer) map.removeLayer(marqueurPositionPointer);
            
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const couleurPointeur = isDark ? '#10ac84' : '#e74c3c';

            marqueurPositionPointer = L.circleMarker([donneesGPX[index].lat, donneesGPX[index].lon], {
                radius: 7, fillColor: couleurPointeur, color: "#ffffff", weight: 2.5, fillOpacity: 1, zIndexOffset: 1000
            }).addTo(map);

            if (recentrerCarte) map.panTo([donneesGPX[index].lat, donneesGPX[index].lon]);
        }

        async function rechercherColIGN(lat, lon) {
            const regexColExplicite = /^(col|pas|port|collet|baisse|hourquette|brèche|breche)\b/i;
            const regexRelief = /\b(col|côte|cote|mont|pas|port|cime|sommet|signal|pic|puy|ballon|crêt|cret|collet|pla|alpe|station|rocher|tête|tete|montagne|suc)\b/i;
            const regexExclure = /parking|refuge|chalet|gîte|gite|hôtel|hotel|restaurant|table d'orientation|belvédère|belvedere|panorama|observatoire|chapelle|croix|monument/i;

            let candidats = [];

            const requetes = ['col', 'mont', 'pas', 'puy', 'sommet'];
            const promesses = requetes.map(async (mot) => {
                try {
                    const url = `https://data.geopf.fr/geocodage/search?q=${mot}&lon=${lon}&lat=${lat}&index=poi&limit=5`;
                    const resp = await fetch(url);
                    if (resp.ok) {
                        const data = await resp.json();
                        if (data.features) {
                            for (const feat of data.features) {
                                const props = feat.properties || {};
                                const coords = feat.geometry ? feat.geometry.coordinates : null;
                                const nom = props.toponym || props.name || "";
                                if (!nom || !coords || regexExclure.test(nom)) continue;

                                const dist = calculerDistance(lat, lon, coords[1], coords[0]);
                                if (dist <= 1.8) {
                                    candidats.push({
                                        nom: nom,
                                        dist: dist,
                                        estCol: regexColExplicite.test(nom),
                                        estRelief: regexRelief.test(nom)
                                    });
                                }
                            }
                        }
                    }
                } catch (e) {}
            });

            const promesseReverse = (async () => {
                try {
                    const urlRev = `https://data.geopf.fr/geocodage/reverse?lon=${lon}&lat=${lat}&index=poi&limit=20`;
                    const respRev = await fetch(urlRev);
                    if (respRev.ok) {
                        const dataRev = await respRev.json();
                        if (dataRev.features) {
                            for (const feat of dataRev.features) {
                                const props = feat.properties || {};
                                const coords = feat.geometry ? feat.geometry.coordinates : null;
                                const nom = props.toponym || props.name || "";
                                const cat = (props.category || []).join(' ').toLowerCase();
                                if (!nom || !coords || regexExclure.test(nom)) continue;

                                const dist = calculerDistance(lat, lon, coords[1], coords[0]);
                                if (dist <= 1.5) {
                                    const estCatRelief = cat.includes('col') || cat.includes('sommet') || cat.includes('montagne') || cat.includes('oronyme') || cat.includes('relief');
                                    if (estCatRelief || regexRelief.test(nom)) {
                                        candidats.push({
                                            nom: nom,
                                            dist: dist,
                                            estCol: regexColExplicite.test(nom) || cat.includes('col'),
                                            estRelief: true
                                        });
                                    }
                                }
                            }
                        }
                    }
                } catch (e) {}
            })();

            await Promise.all([...promesses, promesseReverse]);

            if (candidats.length === 0) return null;

            candidats.sort((a, b) => {
                if (a.estCol !== b.estCol) return a.estCol ? -1 : 1;
                if (a.estRelief !== b.estRelief) return a.estRelief ? -1 : 1;
                return a.dist - b.dist;
            });

            return candidats[0].nom;
        }

        function analyserAscensions(dataAltitude, rawDistances, latlngsSource) {
            let ascensionsDetectees = []; let indexDebut = -1; let altMaxLocale = -Infinity;
            for (let i = 1; i < dataAltitude.length; i++) {
                let alt = dataAltitude[i];
                if (indexDebut === -1) {
                    if (alt > dataAltitude[i-1]) { indexDebut = i - 1; altMaxLocale = alt; }
                } else {
                    if (alt > altMaxLocale) altMaxLocale = alt;
                    if (altMaxLocale - alt > 15 || i === dataAltitude.length - 1) {
                        let vraiIndexSommet = indexDebut; let vraieAltSommet = dataAltitude[indexDebut];
                        for(let j = indexDebut; j <= i; j++){
                            if(dataAltitude[j] > vraieAltSommet) { vraieAltSommet = dataAltitude[j]; vraiIndexSommet = j; }
                        }
                        let denivelePositif = vraieAltSommet - dataAltitude[indexDebut];
                        let distanceMontee = rawDistances[vraiIndexSommet] - rawDistances[indexDebut];
                        
                        if (denivelePositif >= 30 && distanceMontee >= 0.5) {
                            let pente = (denivelePositif / (distanceMontee * 1000)) * 100;
                            ascensionsDetectees.push({
                                kmDebut: rawDistances[indexDebut],
                                kmSommet: rawDistances[vraiIndexSommet],
                                altitudeSommet: Math.round(vraieAltSommet),
                                distance: distanceMontee,
                                denivele: denivelePositif,
                                pente: pente,
                                latDebut: latlngsSource[indexDebut][0], lonDebut: latlngsSource[indexDebut][1],
                                latSommet: latlngsSource[vraiIndexSommet][0], lonSommet: latlngsSource[vraiIndexSommet][1],
                                traceGeo: latlngsSource.slice(indexDebut, vraiIndexSommet + 1)
                            });
                        }
                        indexDebut = -1; altMaxLocale = -Infinity;
                    }
                }
            }
            return ascensionsDetectees;
        }

        async function afficherMonteesEtNoms(ascensionsDetectees, distTotale, listeWaypoints, sessionId) {

            const seuilDeniveleRecherche = distTotale > 300 ? 80 : 30;
            let sommetsAchercher = [];

            ascensionsDetectees.forEach((montee, index) => {

                            nomAscension = wp.name;

                else if (montee.pente < 7) { classePente += " pente-moyenne"; couleurBordure = '#f39c12'; }

                div.innerHTML = `

                    </div>
                    <div class="montee-data" style="flex: 1; text-align:center;">
                        +${Math.round(montee.denivele)} m<br><span style="font-size:10px; color:var(--text-secondary); font-weight:normal;">Dénivelé</span>

                        .bindPopup(`<div style="text-align:center; font-family:sans-serif; font-size: 13px;">
                                        <div style="font-weight: bold; color: ${couleurBordure}; font-size: 15px; margin-bottom: 4px;">⛰️ ${montee.nom}</div>

                const ptMeteoCol = pointsMeteoParcours.find(p => p.estSommet && Math.abs(p.km - s.montee.kmSommet) < 0.2);

        // ---------- FONCTION PRINCIPALE DE LECTURE DU GPX ----------
        function traiterGPX(xmlTexte) {
            sessionChargementId++;
            const currentSession = sessionChargementId;
            
            const xmlDoc = new DOMParser().parseFromString(xmlTexte, "text/xml");
            const trackPoints = xmlDoc.getElementsByTagName("trkpt");
            const waypointsNodes = xmlDoc.getElementsByTagName("wpt");
            
            let listeWaypoints = [];
            for (let i = 0; i < waypointsNodes.length; i++) {
                let wLat = parseFloat(waypointsNodes[i].getAttribute("lat"));
                let wLon = parseFloat(waypointsNodes[i].getAttribute("lon"));
                let nameNode = waypointsNodes[i].getElementsByTagName("name")[0];
                if (nameNode) {
                    listeWaypoints.push({ lat: wLat, lon: wLon, name: nameNode.textContent });
                }
            }
            
            let latlngs = [], labelsDistance = [], dataAltitude = [], rawDistances = [];
            let distanceTotale = 0, denivelePositif = 0, derniereLat = null, derniereLon = null, derniereEle = null;
            pointsMeteoParcours = []; donneesGPX = [];
            
            indexPositionCycliste = null;
            distanceCyclisteActuelle = 0; 
            if (marqueurPositionPointer) map.removeLayer(marqueurPositionPointer);
            if (traceMonteeActive) { map.removeLayer(traceMonteeActive); traceMonteeActive = null; }
            if (marqueurSommetActif) { map.removeLayer(marqueurSommetActif); marqueurSommetActif = null; }

            for (let i = 0; i < trackPoints.length; i++) {
                const lat = parseFloat(trackPoints[i].getAttribute("lat"));
                const lon = parseFloat(trackPoints[i].getAttribute("lon"));
                const eleNode = trackPoints[i].getElementsByTagName("ele")[0];
                const ele = eleNode ? parseFloat(eleNode.textContent) : 0; 
                latlngs.push([lat, lon]);

                if (derniereLat !== null) {
                    const dist = calculerDistance(derniereLat, derniereLon, lat, lon);
                    distanceTotale += dist;
                    if (ele > derniereEle) denivelePositif += (ele - derniereEle); 
                }
                
                donneesGPX.push({ lat: lat, lon: lon, distance: distanceTotale });
                labelsDistance.push(distanceTotale.toFixed(1));
                dataAltitude.push(ele);
                rawDistances.push(distanceTotale); 
                derniereLat = lat; derniereLon = lon; derniereEle = ele;
            }

            if (latlngs.length > 0) {
                const maxPointsVisuels = 1500;
                const pas = Math.max(1, Math.floor(latlngs.length / maxPointsVisuels));
                
                const latlngsOptimises = [];
                const labelsOptimises = [];
                const altitudeOptimisee = [];
                const distancesOptimisees = [];
                const donneesGPXOptimisees = [];

                for (let i = 0; i < latlngs.length; i += pas) {
                    latlngsOptimises.push(latlngs[i]);
                    labelsOptimises.push(labelsDistance[i]);
                    altitudeOptimisee.push(dataAltitude[i]);
                    distancesOptimisees.push(rawDistances[i]);
                    donneesGPXOptimisees.push(donneesGPX[i]);
                }
                if ((latlngs.length - 1) % pas !== 0) {
                    const last = latlngs.length - 1;
                    latlngsOptimises.push(latlngs[last]);
                    labelsOptimises.push(labelsDistance[last]);
                    altitudeOptimisee.push(dataAltitude[last]);
                    distancesOptimisees.push(rawDistances[last]);
                    donneesGPXOptimisees.push(donneesGPX[last]);
                }

                donneesGPX = donneesGPXOptimisees;
                latlngsGlobaux = latlngsOptimises;

                const ascensionsDetectees = analyserAscensions(dataAltitude, rawDistances, latlngs);
                const seuilDeniveleMeteo = distanceTotale < 100 ? 80 : 150;
                const grandsSommets = ascensionsDetectees.filter(m => m.denivele >= seuilDeniveleMeteo);

                let intervalleMeteo = distanceTotale < 30 ? 5 : distanceTotale < 60 ? 10 : distanceTotale < 100 ? 15 : distanceTotale < 200 ? 20 : distanceTotale < 400 ? 30 : 50;
                let pointsStandards = [];
                let prochainPalierMeteo = intervalleMeteo;
                for (let i = 0; i < donneesGPX.length; i++) {
                    if (donneesGPX[i].distance >= prochainPalierMeteo) {
                        pointsStandards.push({ lat: donneesGPX[i].lat, lon: donneesGPX[i].lon, km: prochainPalierMeteo, estArrivee: false, estSommet: false });
                        prochainPalierMeteo += intervalleMeteo;
                    }
                }

                if (pointsStandards.length > 0 && (distanceTotale - pointsStandards[pointsStandards.length - 1].km < (intervalleMeteo * 0.2))) {
                    pointsStandards.pop();
                }

                pointsMeteoParcours = pointsStandards.filter(pt => {
                    const tropProcheSommet = grandsSommets.some(s => Math.abs(s.kmSommet - pt.km) < 3.0);
                    const tropProcheArrivee = (distanceTotale - pt.km) < 2.0;
                    return !tropProcheSommet && !tropProcheArrivee;
                });

                grandsSommets.forEach((s) => {
                    if (distanceTotale - s.kmSommet >= 1.5) {
                        pointsMeteoParcours.push({
                            lat: s.latSommet,
                            lon: s.lonSommet,
                            km: parseFloat(s.kmSommet.toFixed(1)),
                            estArrivee: false,
                            estSommet: true,
                            nomSommet: s.nom || `Sommet (${s.altitudeSommet} m)`
                        });
                    }
                });

                pointsMeteoParcours.push({ lat: derniereLat, lon: derniereLon, km: parseFloat(distanceTotale.toFixed(1)), estArrivee: true, estSommet: false });
                pointsMeteoParcours.sort((a, b) => a.km - b.km);

                if (traceGPXLayer) map.removeLayer(traceGPXLayer);
                
                const isDark = document.body.getAttribute('data-theme') === 'dark';
                const routeColor = isDark ? '#ff4757' : 'red'; 
                
                traceGPXLayer = L.polyline(latlngsOptimises, {color: routeColor, weight: 4}).addTo(map);
                map.fitBounds(traceGPXLayer.getBounds());

                marqueursDistance.forEach(m => map.removeLayer(m));
                marqueursDistance = [];

                let intervalleKm = distanceTotale < 15 ? 1 : distanceTotale < 50 ? 5 : distanceTotale < 100 ? 10 : distanceTotale < 300 ? 20 : 50;

                let prochainKm = intervalleKm;
                for (let i = 0; i < donneesGPX.length; i++) {
                    if (donneesGPX[i].distance >= prochainKm) {
                        if (distanceTotale - prochainKm > (intervalleKm * 0.2)) {
                            let iconeKm = L.divIcon({ html: `<div class="km-marker">${prochainKm}</div>`, className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
                            let marqueurKm = L.marker([donneesGPX[i].lat, donneesGPX[i].lon], {icon: iconeKm, interactive: false}).addTo(map);
                            marqueursDistance.push(marqueurKm);
                        }
                        prochainKm += intervalleKm;
                    }
                }

                document.getElementById('panel-content').style.display = 'block';
                document.getElementById('panel-header').innerHTML = '🔽 Masquer le profil';
                
                document.getElementById('stat-dist').innerText = distanceTotale.toFixed(1);
                document.getElementById('stat-denivele').innerText = Math.round(denivelePositif);
                document.getElementById('gpx-panel').style.display = 'block';
                setTimeout(() => map.invalidateSize(), 300); 

                genererGraphique(labelsOptimises, altitudeOptimisee, distancesOptimisees);
                ajouterVentSurParcours(pointsMeteoParcours);
                afficherMonteesEtNoms(ascensionsDetectees, distanceTotale, listeWaypoints, currentSession);
            }
        }

        function genererHtmlPopupMeteo(pt) {
            if (!pt.meteoCache) return "";
            const { temp, ress, probaPluie, desc } = pt.meteoCache;
            const titreSommet = pt.estSommet ? `<div style="font-weight: bold; color: #ff6b81; font-size: 13px; margin-bottom: 3px;">⛰️ ${pt.nomSommet}</div>` : '';
            const titreArrivee = pt.estArrivee ? `<div style="font-weight: bold; color: #10ac84; font-size: 13px; margin-bottom: 3px;">🏁 Arrivée (Km ${pt.km})</div>` : '';
            const detailPluie = probaPluie > 0 ? `<div style="color: #54a0ff; margin-top: 4px;"><b>💧 Pluie : ${probaPluie}% de risque</b></div>` : '';
            return `<div style="text-align: center; font-family: sans-serif; font-size: 13px; line-height: 1.4;">${titreSommet}${titreArrivee}<div class="temp-popup" style="font-weight: bold; color: var(--border-panel); font-size: 18px; margin-bottom: 2px;">🌡️ ${temp}°C</div><div style="color: var(--text-primary);">Ressenti : <b>${ress}°C</b></div>${detailPluie}<div style="text-transform: capitalize; color: var(--text-secondary); margin-top: 5px;">${desc}</div></div>`;
        }

        function ajouterVentSurParcours(points) {
            marqueursVentParcours.forEach(m => map.removeLayer(m)); marqueursVentParcours = [];
            const vitMoy = parseFloat(document.getElementById('vitesse-moyenne').value) || 25;
            const tempsDepart = Math.floor(new Date(document.getElementById('date-depart').value).getTime() / 1000);

            points.forEach(pt => {
                if (pt.km < distanceCyclisteActuelle - 0.5) {
                    const htmlPasse = `<div style="background: #bdc3c7; border-radius: 50%; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; border: 2px solid #95a5a6; margin: 0 auto; opacity: 0.8;"><span style="font-size: 12px;">✅</span></div><div style="background: rgba(255,255,255,0.8); border-radius: 4px; font-size: 9px; font-weight: bold; text-align: center; margin-top: 2px; width: 40px; margin-left: -8px; color: #7f8c8d;">Km ${pt.km}</div>`;
                    const m = L.marker([pt.lat, pt.lon], {icon: L.divIcon({ html: htmlPasse, className: 'custom-vent-icon', iconSize: [24, 40], iconAnchor: [12, 20] })}).addTo(map);
                    m.bindPopup(`<div style="text-align:center; font-weight:bold; color:#7f8c8d;">Vous êtes déjà passé par ici !</div>`);
                    marqueursVentParcours.push(m); 
                    return; 
                }

                const hArrivee = tempsDepart + (pt.km / vitMoy) * 3600;
                fetch(`${urlRelaisMeteo}/?lat=${pt.lat}&lon=${pt.lon}&type=forecast`)
                .then(r => r.json()).then(data => {
                    let prev = data.list[0], diffMini = Math.abs(prev.dt - hArrivee);
                    for(let i = 1; i < data.list.length; i++) {
                        let diff = Math.abs(data.list[i].dt - hArrivee);
                        if(diff < diffMini) { diffMini = diff; prev = data.list[i]; }
                    }

                    const dateArr = new Date(hArrivee * 1000);
                    let prefix = (dateArr.getDate() !== new Date().getDate()) ? ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'][dateArr.getDay()] + " " : "";
                    const hTexte = prefix + dateArr.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                    
                    const vitKmh = Math.round(prev.wind.speed * 3.6), temp = Math.round(prev.main.temp), ress = Math.round(prev.main.feels_like);
                    const iconePrefixe = pt.estArrivee ? '🏁 ' : pt.estSommet ? '⛰️ ' : '';

                    const isDark = document.body.getAttribute('data-theme') === 'dark';
                    let couleurVent = isDark ? '#10ac84' : '#27ae60'; 
                    
                    if (vitKmh >= 30) { couleurVent = isDark ? '#ff4757' : '#e74c3c'; } 
                    else if (vitKmh >= 15) { couleurVent = isDark ? '#ffa502' : '#f39c12'; }

                    const couleurBordureMeteo = pt.estArrivee ? '#27ae60' : pt.estSommet ? '#e74c3c' : isDark ? '#10ac84' : '#2980b9';
                    let probaPluie = prev.pop ? Math.round(prev.pop * 100) : 0;
                    let textePluie = probaPluie > 10 ? `<span style="color: #3498db; font-weight: bold;">💧 ${probaPluie}%</span><br>` : '';
                    const isDarkStyling = isDark ? 'background: #1e1e1e; color: #f5f6fa; border: 1.5px solid ' + couleurBordureMeteo + ';' : 'background: white; color: #2c3e50; border: 1.5px solid ' + couleurBordureMeteo + ';';

                    pt.meteoCache = { temp, ress, probaPluie, desc: prev.weather[0].description };

                    // ---- NOUVEAU CODE : Gestion du nombre de flèches ----
                    let flechesHTML = '⬇';
                    let taillePoliceFleche = 22;
                    let lineSpacing = 1;

                    if (vitKmh >= 30) {
                        flechesHTML = '⬇<br>⬇<br>⬇'; // Vent violent : 3 flèches
                        taillePoliceFleche = 14;      // On réduit la taille pour que ça rentre
                        lineSpacing = 0.6;            // On resserre l'espacement
                    } else if (vitKmh >= 15) {
                        flechesHTML = '⬇<br>⬇';     // Vent modéré/fort : 2 flèches
                        taillePoliceFleche = 18;
                        lineSpacing = 0.8;
                    }

                    const html = `
                    <div style="background: ${isDark ? 'rgba(30,30,30,0.95)' : 'rgba(255,255,255,0.95)'}; border-radius: 50%; width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; box-shadow: 0 2px 5px var(--shadow); border: 3px solid ${couleurVent}; margin: 0 auto; pointer-events: none;">
                        <div style="transform: rotate(${prev.wind.deg}deg); font-size: ${taillePoliceFleche}px; line-height: ${lineSpacing}; font-weight: bold; color: ${couleurVent}; text-align: center; display: flex; flex-direction: column; justify-content: center;">${flechesHTML}</div>
                    </div>
                    <div style="${isDarkStyling} border-radius: 4px; font-size: 11px; font-weight: bold; text-align: center; box-shadow: 0 1px 3px var(--shadow); margin-top: 4px; width: 72px; margin-left: -18px; padding: 3px 0; pointer-events: none; line-height: 1.3;">
                        ${iconePrefixe}${vitKmh} km/h<br>${textePluie}<span style="color: var(--text-secondary); font-size: 9px;">🕒 ${hTexte}</span>
                    </div>`;
                    
                    const marqueur = L.marker([pt.lat, pt.lon], {icon: L.divIcon({ html: html, className: 'custom-vent-icon', iconSize: [36, 68], iconAnchor: [18, 30] })}).addTo(map);
                    marqueur.bindPopup(genererHtmlPopupMeteo(pt));
                    marqueur.on('click', function(e) { this.openPopup(); });
                    pt.marqueur = marqueur;
                    marqueursVentParcours.push(marqueur); 
                });
            });
        }

        const pluginCycliste = {
            id: 'pointCycliste',
            afterDraw: (chart) => {
                if (indexPositionCycliste !== null && indexPositionCycliste >= 0) {
                    const ctx = chart.ctx, point = chart.getDatasetMeta(0).data[indexPositionCycliste];
                    if(point) { 
                        const isDark = document.body.getAttribute('data-theme') === 'dark';
                        ctx.save(); ctx.beginPath(); ctx.arc(point.x, point.y, 6.5, 0, 2 * Math.PI); 
                        ctx.fillStyle = isDark ? '#10ac84' : '#e74c3c'; 
                        ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke(); ctx.restore(); 
                    }
                }
            }
        };

        function genererGraphique(labels, data, rawDistances) {
            if (graphiqueAltitude) graphiqueAltitude.destroy(); 
            
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const colorGrilleText = isDark ? '#a4b0be' : '#7f8c8d';
            const colorLigneGrille = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
            const opacite = isDark ? '0.3' : '0.4'; 

            graphiqueAltitude = new Chart(document.getElementById('elevationChart').getContext('2d'), {
                type: 'line',
                data: { 
                    labels: labels, 
                    datasets: [{ 
                        label: 'Altitude', 
                        data: data, 
                        borderWidth: 3, 
                        borderColor: '#27ae60',
                        backgroundColor: `rgba(39, 174, 96, ${opacite})`, 
                        fill: true, 
                        pointRadius: 0, 
                        tension: 0.1, 
                        segment: { 
                            borderColor: ctx => {
                                if (!rawDistances || ctx.p0DataIndex >= rawDistances.length - 1) return '#27ae60'; 
                                const i = ctx.p0DataIndex;
                                const dist = (rawDistances[i + 1] - rawDistances[i]) * 1000;
                                if (dist <= 0.1) return '#27ae60';
                                const pente = ((data[i + 1] - data[i]) / dist) * 100;
                                return (pente < -1) ? '#3498db' : (pente < 3) ? '#27ae60' : (pente < 7) ? '#f39c12' : '#e74c3c';                 
                            },
                            backgroundColor: ctx => {
                                if (!rawDistances || ctx.p0DataIndex >= rawDistances.length - 1) return `rgba(39, 174, 96, ${opacite})`; 
                                const i = ctx.p0DataIndex;
                                const dist = (rawDistances[i + 1] - rawDistances[i]) * 1000;
                                if (dist <= 0.1) return `rgba(39, 174, 96, ${opacite})`;
                                const pente = ((data[i + 1] - data[i]) / dist) * 100;
                                return (pente < -1) ? `rgba(52, 152, 219, ${opacite})` : (pente < 3) ? `rgba(39, 174, 96, ${opacite})` : (pente < 7) ? `rgba(243, 156, 18, ${opacite})` : `rgba(231, 76, 60, ${opacite})`;                 
                            }
                        }
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    onClick: (event, activeElements) => {
                        if (activeElements.length > 0) { mettreAJourPointeur(activeElements[0].index, true); }
                    },
                    plugins: { 
                        legend: { display: false }, 
                        zoom: { 
                            pan: { enabled: true, mode: 'x', onPan: () => document.getElementById('btn-reset-zoom').style.display = 'inline-block' }, 
                            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x', onZoom: () => document.getElementById('btn-reset-zoom').style.display = 'inline-block' } 
                        } 
                    }, 
                    scales: { 
                        x: { ticks: { maxTicksLimit: 8, color: colorGrilleText }, grid: { color: colorLigneGrille } }, 
                        y: { title: { display: true, text: 'Mètres', color: colorGrilleText }, ticks: { color: colorGrilleText }, grid: { color: colorLigneGrille } } 
                    } 
                },
                plugins: [pluginCycliste]
            });
        }

        document.getElementById('btn-gps').addEventListener('click', function() {
            this.innerText = "⏳..."; 
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    const lat = pos.coords.latitude, lon = pos.coords.longitude;
                    map.setView([lat, lon], 13);
                    
                    if (donneesGPX.length > 0) {
                        let indexPlusProche = 0;
                        let distMin = Infinity;
                        
                        for (let i = 0; i < donneesGPX.length; i++) {
                            let d = calculerDistance(lat, lon, donneesGPX[i].lat, donneesGPX[i].lon);
                            if (d < distMin) { distMin = d; indexPlusProche = i; }
                        }
                        
                        if (distMin < 2) {
                            distanceCyclisteActuelle = donneesGPX[indexPlusProche].distance;
                            mettreAJourPointeur(indexPlusProche, false);
                            ajouterVentSurParcours(pointsMeteoParcours);
                        }
                    }

                    fetch(`${urlRelaisMeteo}/?lat=${lat}&lon=${lon}&type=weather`)
                    .then(r => r.json()).then(data => {
                        document.getElementById('ville').innerText = data.name;
                        document.getElementById('temperature').innerText = Math.round(data.main.temp);
                        document.getElementById('temp-ressentie').innerText = Math.round(data.main.feels_like);
                        document.getElementById('description').innerText = data.weather[0].description;
                        document.getElementById('icone').src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
                        document.getElementById('vitesse-vent').innerText = Math.round(data.wind.speed * 3.6);
                        document.getElementById('direction-vent').innerText = ['Nord', 'Nord-Est', 'Est', 'Sud-Est', 'Sud', 'Sud-Ouest', 'Ouest', 'Nord-Ouest'][Math.round(data.wind.deg / 45) % 8];
                        document.getElementById('fleche').style.transform = `rotate(${data.wind.deg}deg)`;
                        document.getElementById('meteo-widget').style.display = 'block';
                        document.getElementById('btn-gps').innerText = "🔄 Actualiser";
                    });
                }, () => { 
                    this.innerText = "📍 Ma Position"; document.getElementById('meteo-widget').style.display = 'block'; 
                });
            }
        });
    </script>
</body>
</html>
